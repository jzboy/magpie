name: 浩哥AI Release

# Builds 浩哥AI's two artifacts:
#   - macOS arm64 .dmg  (macos-14 runner is arm64; the GUI needs cgo + WebKit,
#     so it is built natively there)
#   - Windows amd64 .exe (WebView2 needs no cgo, so it cross-compiles on Linux)
# On a haoge-v* tag the dmg is also committed into release/ on the haoge-ai
# branch (the Windows exe is already there, built on Windows), and both are
# attached to a GitHub release. No signing or notarisation: the macOS app is
# unsigned, so first open is a right-click → Open. Trigger by pushing a
# haoge-v* tag (works before this file is on the default branch); the Run
# workflow button appears once it is on main.

on:
  push:
    tags:
      - 'haoge-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    # A self-hosted Apple-silicon Mac: GitHub's hosted macOS runners are not
    # available to this repository ("macos-14-arm64-us-default is not
    # supported"). The runner is registered at Settings → Actions → Runners
    # and gets the labels self-hosted, macOS and ARM64. To use a runner group
    # instead, write:
    #   runs-on:
    #     group: Default
    #     labels: [self-hosted, macOS, ARM64]
    # An Intel Mac labels itself X64 and would produce an x64 dmg (rename the
    # artifact and the Makefile's release-dmg output then).
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # the version comes from the newest haoge-v tag
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build icons and the arm64 disk image
        run: |
          make icons
          make release-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: haoge-ai-darwin-arm64.dmg
          path: dist/haoge-ai-darwin-arm64.dmg

  exe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # the version comes from the newest haoge-v tag
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the Windows amd64 executable
        run: make release-windows
      - uses: actions/upload-artifact@v4
        with:
          name: haoge-ai-windows-amd64.exe
          path: dist/haoge-ai-windows-amd64.exe

  # The Windows exe is published on its own: a repository whose account can't
  # use GitHub's macOS runners (the dmg job is cancelled with "macos-14-arm64-us-
  # default is not supported") still gets a Release, and the dmg is attached
  # when a macOS runner built one.
  release:
    # waits for the dmg too, so a dmg that finished is attached: a release
    # that ran when only the exe was in lost v1.3's dmg this way. always()
    # keeps a cancelled or failed dmg job from holding the exe back.
    needs: [exe, dmg]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(dist/haoge-ai-windows-amd64.exe)
          [ -f dist/haoge-ai-darwin-arm64.dmg ] && files+=(dist/haoge-ai-darwin-arm64.dmg)
          # A tag can already have a Release (an earlier run of the same
          # push created it, and v1.3's dmg was lost this way): create
          # refuses a Release that exists, so its assets are uploaded to it
          # instead, the dmg included.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "浩哥AI $TAG" \
              --notes "浩哥AI — Windows amd64 (.exe)，macOS arm64 (.dmg) 由可用的 macOS 运行器构建时附带。基于 yetone/magpie 二次开发（MIT）。" \
              "${files[@]}"
          fi

  # Puts the CI-built dmg on the haoge-ai branch beside the Windows exe, so
  # both artifacts live on the branch (the dmg cannot be built on Windows).
  publish-branch:
    needs: [dmg]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: haoge-ai
          token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: haoge-ai-darwin-arm64.dmg
          path: release
      - name: Commit the dmg to haoge-ai
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/haoge-ai-darwin-arm64.dmg
          if git diff --cached --quiet; then
            echo "dmg unchanged"
          else
            git commit -m "release: macOS arm64 dmg built by CI (${{ github.ref_name }})"
            git push origin HEAD:haoge-ai
          fi